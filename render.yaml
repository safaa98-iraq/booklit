# Render Blueprint: New → Blueprint → select this repository.
# Creates the Laravel web service (Docker) and a PostgreSQL database.
services:
  - type: web
    name: kakeibo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Kakeibo
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false            # e.g. https://kakeibo.onrender.com
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: kakeibo-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: SEED_DEMO         # "true" creates demo@kakeibo.test / password
        value: "false"

databases:
  - name: kakeibo-db
    plan: free
    region: frankfurt
    databaseName: kakeibo
    user: kakeibo
